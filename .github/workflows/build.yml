name: Build FitForge APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Project Files
        run: |
          mkdir -p FitForge/app/src/main/java/com/fitforge/personal/data
          mkdir -p FitForge/app/src/main/res/values

          # settings.gradle.kts
          echo "" | base64 -d > FitForge/settings.gradle.kts

          # root build.gradle.kts
          echo "" | base64 -d > FitForge/build.gradle.kts

          # app/build.gradle.kts
          echo "" | base64 -d > FitForge/app/build.gradle.kts

          # app/src/main/AndroidManifest.xml
          echo "" | base64 -d > FitForge/app/src/main/AndroidManifest.xml

          # AppDatabase.kt
          echo "" | base64 -d > FitForge/app/src/main/java/com/fitforge/personal/data/AppDatabase.kt

