name: Build FitForge APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch and Build Android APK
        run: |
          set -e
          
          # 1. Download official template structure
          git clone --depth 1 https://github.com/android/compose-samples.git temp_repo || true
          
          # 2. Setup standard Android Compose project workspace
          mkdir -p FitForge/app/src/main/java/com/fitforge/personal/data
          mkdir -p FitForge/app/src/main/res/values

          # 3. Create settings file
          printf "pluginManagement {\n  repositories {\n    google()\n    mavenCentral()\n    gradlePluginPortal()\n  }\n}\ndependencyResolutionManagement {\n  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n  repositories {\n    google()\n    mavenCentral()\n  }\n}\nrootProject.name = \"FitForge\"\ninclude(\":app\")\n" > FitForge/settings.gradle.kts

          # 4. Create root build file
          printf "plugins {\n  id(\"com.android.application\") version \"8.7.3\" apply false\n  id(\"org.jetbrains.kotlin.android\") version \"2.0.21\" apply false\n  id(\"org.jetbrains.kotlin.plugin.compose\") version \"2.0.21\" apply false\n  id(\"com.google.devtools.ksp\") version \"2.0.21-1.0.28\" apply false\n}\n" > FitForge/build.gradle.kts

          # 5. Create app build file
          printf "plugins {\n  id(\"com.android.application\")\n  id(\"org.jetbrains.kotlin.android\")\n  id(\"org.jetbrains.kotlin.plugin.compose\")\n  id(\"com.google.devtools.ksp\")\n}\nandroid {\n  namespace = \"com.fitforge.personal\"\n  compileSdk = 35\n  defaultConfig {\n    applicationId = \"com.fitforge.personal\"\n    minSdk = 26\n    targetSdk = 35\n    versionCode = 1\n    versionName = \"1.0\"\n  }\n  buildFeatures { compose = true }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n  kotlinOptions { jvmTarget = \"17\" }\n}\ndependencies {\n  implementation(\"androidx.core:core-ktx:1.15.0\")\n  implementation(\"androidx.lifecycle:lifecycle-runtime-ktx:2.8.7\")\n  implementation(\"androidx.activity:activity-compose:1.9.3\")\n  implementation(platform(\"androidx.compose:compose-bom:2024.11.00\"))\n  implementation(\"androidx.compose.ui:ui\")\n  implementation(\"androidx.compose.ui:ui-graphics\")\n  implementation(\"androidx.compose.material3:material3\")\n  implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7\")\n  val room_version = \"2.6.1\"\n  implementation(\"androidx.room:room-runtime:\$room_version\")\n  implementation(\"androidx.room:room-ktx:\$room_version\")\n  ksp(\"androidx.room:room-compiler:\$room_version\")\n}\n" > FitForge/app/build.gradle.kts

          # 6. Create manifest
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n  <application android:allowBackup=\"true\" android:label=\"FitForge\" android:theme=\"@android:style/Theme.NoTitleBar\">\n    <activity android:name=\".MainActivity\" android:exported=\"true\">\n      <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n" > FitForge/app/src/main/AndroidManifest.xml

          # 7. Create Room Database
          printf "package com.fitforge.personal.data\n\nimport android.content.Context\nimport androidx.room.*\nimport kotlinx.coroutines.flow.Flow\n\n@Entity(tableName = \"fitness_day\")\ndata class FitnessDay(\n  @PrimaryKey val date: String = java.text.SimpleDateFormat(\"yyyy-MM-dd\", java.util.Locale.getDefault()).format(java.util.Date()),\n  val steps: Int = 0,\n  val workoutMinutes: Int = 0,\n  val waterMl: Int = 0\n)\n\n@Entity(tableName = \"finance_entry\")\ndata class FinanceEntry(\n  @PrimaryKey(autoGenerate = true) val id: Int = 0,\n  val date: String,\n  val title: String,\n  val amount: Double,\n  val type: String,\n  val category: String\n)\n\n@Dao\ninterface FitnessDao {\n  @Query(\"SELECT * FROM fitness_day WHERE date = :date LIMIT 1\")\n  fun getTodayFitness(date: String = java.text.SimpleDateFormat(\"yyyy-MM-dd\", java.util.Locale.getDefault()).format(java.util.Date())): Flow<FitnessDay?>\n  @Insert(onConflict = OnConflictStrategy.REPLACE)\n  suspend fun insertOrUpdate(day: FitnessDay)\n}\n\n@Dao\ninterface FinanceDao {\n  @Query(\"SELECT * FROM finance_entry ORDER BY id DESC\")\n  fun getAllEntries(): Flow<List<FinanceEntry>>\n  @Query(\"SELECT SUM(amount) FROM finance_entry WHERE type = 'income'\")\n  fun getTotalIncome(): Flow<Double?>\n  @Query(\"SELECT SUM(amount) FROM finance_entry WHERE type = 'expense'\")\n  fun getTotalExpense(): Flow<Double?>\n  @Insert\n  suspend fun insertEntry(entry: FinanceEntry)\n}\n\n@Database(entities = [FitnessDay::class, FinanceEntry::class], version = 1, exportSchema = false)\nabstract class AppDatabase : RoomDatabase() {\n  abstract fun fitnessDao(): FitnessDao\n  abstract fun financeDao(): FinanceDao\n  companion object {\n    @Volatile private var INSTANCE: AppDatabase? = null\n    fun getDatabase(context: Context): AppDatabase {\n      return INSTANCE ?: synchronized(this) {\n        val instance = Room.databaseBuilder(context.applicationContext, AppDatabase::class.java, \"fitforge.db\").build()\n        INSTANCE = instance\n        instance\n      }\n    }\n  }\n}\n" > FitForge/app/src/main/java/com/fitforge/personal/data/AppDatabase.kt

          # 8. Create MainActivity
          printf "package com.fitforge.personal\n\nimport android.content.Context\nimport android.os.Bundle\nimport androidx.activity.ComponentActivity\nimport androidx.activity.compose.setContent\nimport androidx.compose.animation.core.*\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.draw.scale\nimport androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport androidx.lifecycle.ViewModel\nimport androidx.lifecycle.ViewModelProvider\nimport androidx.lifecycle.viewmodel.compose.viewModel\nimport androidx.lifecycle.viewModelScope\nimport com.fitforge.personal.data.*\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.flow.*\nimport kotlinx.coroutines.launch\nimport java.util.Locale\n\nclass MainViewModel(private val context: Context) : ViewModel() {\n  private val db = AppDatabase.getDatabase(context)\n  val todayFitness = db.fitnessDao().getTodayFitness().stateIn(viewModelScope, SharingStarted.Lazily, null)\n  val allFinance = db.financeDao().getAllEntries().stateIn(viewModelScope, SharingStarted.Lazily, emptyList())\n  val totalIncome = db.financeDao().getTotalIncome().stateIn(viewModelScope, SharingStarted.Lazily, 0.0)\n  val totalExpense = db.financeDao().getTotalExpense().stateIn(viewModelScope, SharingStarted.Lazily, 0.0)\n  fun addSteps(a: Int) = viewModelScope.launch { val c = todayFitness.value ?: FitnessDay(); db.fitnessDao().insertOrUpdate(c.copy(steps = c.steps + a)) }\n  fun addWorkout(m: Int) = viewModelScope.launch { val c = todayFitness.value ?: FitnessDay(); db.fitnessDao().insertOrUpdate(c.copy(workoutMinutes = c.workoutMinutes + m)) }\n  fun addWater(w: Int) = viewModelScope.launch { val c = todayFitness.value ?: FitnessDay(); db.fitnessDao().insertOrUpdate(c.copy(waterMl = c.waterMl + w)) }\n  fun addFinanceEntry(t: String, a: Double, ty: String, cat: String) = viewModelScope.launch { db.financeDao().insertEntry(FinanceEntry(title = t, amount = a, type = ty, category = cat, date = java.text.SimpleDateFormat(\"dd MMM yyyy\", Locale.getDefault()).format(java.util.Date()))) }\n}\n\nclass MainViewModelFactory(private val context: Context) : ViewModelProvider.Factory {\n  override fun <T : ViewModel> create(modelClass: Class<T>): T = MainViewModel(context.applicationContext) as T\n}\n\nclass MainActivity : ComponentActivity() {\n  override fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContent { FitForgeApp() }\n  }\n}\n\n@Composable\nfun FitForgeApp() {\n  val context = LocalContext.current\n  val vm: MainViewModel = viewModel(factory = MainViewModelFactory(context))\n  var showIntro by remember { mutableStateOf(true) }\n  if (showIntro) IntroScreen { showIntro = false } else MainScreen(vm)\n}\n\n@Composable\nfun IntroScreen(onComplete: () -> Unit) {\n  val infiniteTransition = rememberInfiniteTransition(label = \"pulse\")\n  val scale by infiniteTransition.animateFloat(initialValue = 0.95f, targetValue = 1.05f, animationSpec = infiniteRepeatable(tween(1200, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = \"scale\")\n  LaunchedEffect(Unit) { delay(2500); onComplete() }\n  Box(modifier = Modifier.fillMaxSize().background(Brush.radialGradient(listOf(Color(0xFF2A164D), Color(0xFF0D0B14)), radius = 1200f)), contentAlignment = Alignment.Center) {\n    Column(horizontalAlignment = Alignment.CenterHorizontally) {\n      Box(modifier = Modifier.size(130.dp).scale(scale).clip(CircleShape).background(Brush.linearGradient(listOf(Color(0xFFFF3366), Color(0xFFFF9933)))), contentAlignment = Alignment.Center) {\n        Text(\"F\", color = Color.White, fontSize = 64.sp, fontWeight = FontWeight.Black)\n      }\n      Spacer(modifier = Modifier.height(28.dp))\n      Text(\"FITFORGE\", color = Color.White, fontSize = 32.sp, fontWeight = FontWeight.ExtraBold, letterSpacing = 6.sp)\n      Text(\"TRAIN • TRACK • CONQUER\", color = Color(0xFFFFAA44), fontSize = 12.sp, fontWeight = FontWeight.Bold, letterSpacing = 3.sp, modifier = Modifier.padding(top = 8.dp))\n    }\n  }\n}\n\n@Composable\nfun MainScreen(vm: MainViewModel) {\n  var selectedTab by remember { mutableIntStateOf(0) }\n  val todayFitness by vm.todayFitness.collectAsState()\n  val allFinance by vm.allFinance.collectAsState()\n  val income by vm.totalIncome.collectAsState()\n  val expense by vm.totalExpense.collectAsState()\n  var showDialog by remember { mutableStateOf(false) }\n  Scaffold(\n    containerColor = Color(0xFF10121A),\n    bottomBar = {\n      NavigationBar(containerColor = Color(0xFF161822)) {\n        NavigationBarItem(selected = selectedTab == 0, onClick = { selectedTab = 0 }, label = { Text(\"Fitness\") }, icon = { Text(\"💪\") })\n        NavigationBarItem(selected = selectedTab == 1, onClick = { selectedTab = 1 }, label = { Text(\"Finance\") }, icon = { Text(\"💳\") })\n      }\n    },\n    floatingActionButton = {\n      if (selectedTab == 1) FloatingActionButton(onClick = { showDialog = true }, containerColor = Color(0xFFFF3366), contentColor = Color.White) { Text(\"+\", fontSize = 24.sp) }\n    }\n  ) { p ->\n    Box(modifier = Modifier.padding(p).fillMaxSize().padding(16.dp)) {\n      if (selectedTab == 0) FitnessTab(todayFitness, vm) else FinanceTab(income ?: 0.0, expense ?: 0.0, allFinance)\n    }\n    if (showDialog) AddTransactionDialog(onDismiss = { showDialog = false }, onAdd = { t, a, ty, c -> vm.addFinanceEntry(t, a, ty, c); showDialog = false })\n  }\n}\n\n@Composable\nfun FitnessTab(today: FitnessDay?, vm: MainViewModel) {\n  val current = today ?: FitnessDay()\n  LazyColumn(verticalArrangement = Arrangement.spacedBy(16.dp)) {\n    item { MetricCard(\"Steps Taken\", \"\${current.steps} / 10,000\", (current.steps / 10000f).coerceIn(0f, 1f), Color(0xFFFF9933)) }\n    item { MetricCard(\"Workout Time\", \"\${current.workoutMinutes} min / 60 min\", (current.workoutMinutes / 60f).coerceIn(0f, 1f), Color(0xFFFF3366)) }\n    item { MetricCard(\"Water Intake\", \"\${current.waterMl} ml / 3,000 ml\", (current.waterMl / 3000f).coerceIn(0f, 1f), Color(0xFF33CCFF)) }\n    item { Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {\n      Button(onClick = { vm.addSteps(500) }, modifier = Modifier.weight(1f)) { Text(\"+500\") }\n      Button(onClick = { vm.addWorkout(15) }, modifier = Modifier.weight(1f)) { Text(\"+15m\") }\n      Button(onClick = { vm.addWater(250) }, modifier = Modifier.weight(1f)) { Text(\"+250ml\") }\n    }}\n  }\n}\n\n@Composable\nfun MetricCard(title: String, subtitle: String, progress: Float, color: Color) {\n  Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1E2130)), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {\n    Column(modifier = Modifier.padding(16.dp)) {\n      Text(title, color = Color.Gray, fontSize = 14.sp)\n      Text(subtitle, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 22.sp, modifier = Modifier.padding(vertical = 6.dp))\n      LinearProgressIndicator(progress = { progress }, modifier = Modifier.fillMaxWidth().height(8.dp).clip(CircleShape), color = color, trackColor = Color(0xFF2C3147))\n    }\n  }\n}\n\n@Composable\nfun FinanceTab(income: Double, expense: Double, list: List<FinanceEntry>) {\n  LazyColumn(verticalArrangement = Arrangement.spacedBy(14.dp)) {\n    item { Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1E2130)), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {\n      Column(modifier = Modifier.padding(18.dp)) {\n        Text(\"Net Balance\", color = Color.Gray)\n        Text(\"₹\${String.format(Locale.getDefault(), \\\"%%.2f\\\", income - expense)}\", color = Color.White, fontWeight = FontWeight.Black, fontSize = 28.sp)\n        Spacer(modifier = Modifier.height(12.dp))\n        Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {\n          Text(\"Income: +₹\${String.format(Locale.getDefault(), \\\"%%.2f\\\", income)}\", color = Color(0xFF00E676), fontWeight = FontWeight.Bold)\n          Text(\"Spent: -₹\${String.format(Locale.getDefault(), \\\"%%.2f\\\", expense)}\", color = Color(0xFFFF5252), fontWeight = FontWeight.Bold)\n        }\n      }\n    }}\n    items(list) { i -> Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF161822)), modifier = Modifier.fillMaxWidth()) {\n      Row(modifier = Modifier.fillMaxWidth().padding(14.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {\n        Column { Text(i.title, color = Color.White, fontWeight = FontWeight.SemiBold); Text(\"\${i.category} • \${i.date}\", color = Color.Gray, fontSize = 12.sp) }\n        Text((if (i.type == \"income\") \"+₹\" else \"-₹\") + String.format(Locale.getDefault(), \"%%.2f\", i.amount), color = if (i.type == \"income\") Color(0xFF00E676) else Color(0xFFFF5252), fontWeight = FontWeight.Bold)\n      }\n    }}\n  }\n}\n\n@Composable\nfun AddTransactionDialog(onDismiss: () -> Unit, onAdd: (String, Double, String, String) -> Unit) {\n  var t by remember { mutableStateOf(\"\") }\n  var a by remember { mutableStateOf(\"\") }\n  var ty by remember { mutableStateOf(\"expense\") }\n  var c by remember { mutableStateOf(\"General\") }\n  AlertDialog(\n    onDismissRequest = onDismiss,\n    title = { Text(\"New Transaction\") },\n    text = {\n      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n        OutlinedTextField(value = t, onValueChange = { t = it }, label = { Text(\"Title\") })\n        OutlinedTextField(value = a, onValueChange = { a = it }, label = { Text(\"Amount (₹)\") })\n        OutlinedTextField(value = c, onValueChange = { c = it }, label = { Text(\"Category\") })\n        Row { RadioButton(selected = ty == \"expense\", onClick = { ty = \"expense\" }); Text(\"Expense\"); Spacer(Modifier.width(16.dp)); RadioButton(selected = ty == \"income\", onClick = { ty = \"income\" }); Text(\"Income\") }\n      }\n    },\n    confirmButton = { Button(onClick = { val n = a.toDoubleOrNull() ?: 0.0; if (t.isNotBlank() && n > 0) onAdd(t, n, ty, c) }) { Text(\"Save\") } },\n    dismissButton = { TextButton(onClick = onDismiss) { Text(\"Cancel\") } }\n  )\n}\n" > FitForge/app/src/main/java/com/fitforge/personal/MainActivity.kt

          # 9. Download Gradle binaries & trigger standard build
          cd FitForge
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          ./gradle-8.10.2/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitForge-debug-apk
          path: FitForge/app/build/outputs/apk/debug/app-debug.apk
          
